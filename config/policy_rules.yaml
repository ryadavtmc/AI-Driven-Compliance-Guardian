# ==========================================================
# Policy Rules for AI-Driven Compliance Guardian
# Actions:
#   block → deny or quarantine truly sensitive/secret material
#   mask  → redact before storage/transmission (LLM-safe)
# ==========================================================

# ----------------------------------------------------------
# Regex-based Blocking Rules (hard block)
# ----------------------------------------------------------
block_categories:
  - "Credit Card Number"
  - "US SSN"
  - "API Key"
  - "JWT"
  - "Database URL (common schemes)"
  - "Generic Credential Assignment"
  - "Access Token"
  - "Bank Account Number"
  - "Routing Number"
  - "Private Key"
  - "Password or Secret Value"
  - "RSA Token"
  - "SSH RSA Public Key"
  - "OpenSSH Key Block"
  - "Account Number"

# ----------------------------------------------------------
# Regex-based Masking Rules (safe redaction)
# ----------------------------------------------------------
mask_categories:
  - "Email Address"
  - "Email"
  - "EMAIL"
  - "E-mail"
  - "B-EMAIL"
  - "I-EMAIL"
  - "US Phone Number"
  - "International Phone Number"
  - "Physical Address"
  - "Person Name"
  - "IP Address"
  - "IPv4 Address"
  - "Date of Birth"
  - "Postal Code"
  - "Organization Name"
  - "Date of Birth"

# ----------------------------------------------------------
# PII NER Label → Action Mapping
# (normalized, no tokenizer subword fragments)
# ----------------------------------------------------------
pii_entity_policy:
  NAME: mask
  Email Address: mask
  EMAIL_ADDRESS: mask
  Email: mask
  EMAIL: mask
  PHONE: mask
  ADDRESS: mask
  ID: block          # government/unique IDs → block
  DOB: mask
  ORGANIZATION: mask

# ----------------------------------------------------------
# Decision Thresholds
# ----------------------------------------------------------
thresholds:
  secret_block: 0.70     # BERT secret classifier block cutoff
  ml_unsafe: 0.80        # ML ensemble unsafe cutoff (raised to avoid over-block)
  regex_confidence: 0.60 # minimum regex confidence to trigger
  pii_confidence: 0.40   # NER masking strength heuristic